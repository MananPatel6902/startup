  <body>
    <!-- Netlify scans the built HTML before React renders. Keep this form in sync
         with the interactive contact form in src/pages/Contact.jsx. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="subject" type="text" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
